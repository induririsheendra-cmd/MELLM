                    </div>
                </div>
            </div>
            
            <input type="file" id="doc-upload" accept=".pdf,.txt,.md" style="display: none;" onchange="App.handleDocUpload(event)">
            <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp" style="display: none;" onchange="App.handleImageUpload(event)">
        </div>

    </main>

    <script>
        // 1. API Client
        const API = {
            activeDownloads: new Set(),
            
            async streamQuery(prompt, imageData, enableMemory, domainHint, callbacks, signal) {
                const {onRouting, onLoaded, onToken, onMultiAgentStart, onSubAgentStart, onSubAgentLoaded, onSubAgentToken, onSubAgentDone, onDone, onError} = callbacks;
                try {
                    const response = await fetch('/query/stream', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({prompt, image_data: imageData, enable_memory: enableMemory, domain_hint: domainHint}),
                        signal: signal
                    });
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            try {
                                const event = JSON.parse(line.slice(6));
                                if (event.type === 'routing') onRouting(event);
                                else if (event.type === 'loaded') onLoaded(event);
                                else if (event.type === 'token') onToken(event);
                                else if (event.type === 'multi_agent_start') onMultiAgentStart(event);
                                else if (event.type === 'sub_agent_start') onSubAgentStart(event);
                                else if (event.type === 'sub_agent_loaded') onSubAgentLoaded(event);
                                else if (event.type === 'sub_agent_token') onSubAgentToken(event);
                                else if (event.type === 'sub_agent_done') onSubAgentDone(event);
                                else if (event.type === 'done') onDone(event);
                                else if (event.type === 'error') onError(event.message);
                            } catch (e) { console.error("Parse error", e); }
                        }
                    }
                } catch (e) { 
                    if (e.name === 'AbortError') onError('AbortError');
                    else onError(e.message); 
                }
            },

            async getStatus() {
                const r = await fetch('/status');
                return r.json();
            },

            async clearContext() {
                await fetch('/context', {method: 'DELETE'});
            }
        };

        // 2. UI Renderer
        const UI = {
            container: document.getElementById('chat-container'),
            input: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            stopBtn: document.getElementById('stop-btn'),
            slashMenu: document.getElementById('slash-menu'),

            toggleAttachmentMenu() {
                const menu = document.getElementById('attachment-menu');
                menu.classList.toggle('show');
            },

            showSlashMenu() {
                this.slashMenu.classList.add('show');
            },

            hideSlashMenu() {
                this.slashMenu.classList.remove('show');
            },

            selectSlashCommand(type) {
                // Remove the / text
                const text = this.input.value;
                const lastSlashIdx = text.lastIndexOf('/');
                if (lastSlashIdx >= 0) {
                    this.input.value = text.substring(0, lastSlashIdx).trim();
                }
                
                this.hideSlashMenu();
                
                if (type === 'doc') {
                    document.getElementById('doc-upload').click();
                } else if (type === 'image') {
                    document.getElementById('image-upload').click();
                }
                this.input.focus();
            },

            addUserMessage(text, imageData) {
                const msg = document.createElement('div');
                msg.className = 'message user';
                let imgHtml = '';
                if (imageData) {
                    imgHtml = `<img src="${imageData}" class="user-image-attachment" onclick="document.getElementById('lightbox-img').src=this.src; document.getElementById('lightbox-overlay').style.display='flex';" title="Click to expand">`;
                }
                msg.innerHTML = `<div class="bubble message-content">${imgHtml}${this.escapeHtml(text)}</div>`;
                this.container.appendChild(msg);
                this.scrollToBottom();
            },

            addTypingIndicator() {
                const id = 'msg-' + Date.now();
                const msg = document.createElement('div');
                msg.className = 'message assistant';
                msg.id = id;
                msg.innerHTML = `
                    <div class="bubble message-content">
                        <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                `;
                this.container.appendChild(msg);
                this.scrollToBottom();
                return id;
            },

            upgradeToBubble(id, domain) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                bubble.innerHTML = '';
                
                const badge = document.createElement('div');
                badge.className = `badge badge-${domain.toLowerCase().replace('_', '-')}`;
                badge.textContent = domain;
                msg.insertBefore(badge, bubble);
            },

            appendToken(id, token) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                
                // Track current state for code blocks
                if (!bubble.dataset.raw) bubble.dataset.raw = '';
                bubble.dataset.raw += token;

                // Robust markdown rendering on full accumulated text
                bubble.innerHTML = this.renderMarkdown(bubble.dataset.raw);
                
                // Highlight code blocks
                bubble.querySelectorAll('.code-block code:not(.hljs-highlighted)').forEach((block) => {
                    if (!block.textContent.includes('%%')) {  // skip placeholders
                        hljs.highlightElement(block);
                        block.classList.add('hljs-highlighted');
                    }
                });
                
                this.scrollToBottom();
            },

            finalizeMessage(id, event) {
                const msg = document.getElementById(id);
                if (!msg) return;

                const metrics = document.createElement('div');
                metrics.className = 'metrics-bar';
                
                const cacheIcon = event.cache_hit ? '♻' : '⚡';
                metrics.innerHTML = `
                    <span>Load: ${event.specialist_load_time.toFixed(2)}s ${cacheIcon}</span>
                    <span>Inference: ${event.inference_time_seconds.toFixed(2)}s</span>
                    <span>Context: ${event.context_turns} turns</span>
                `;
                msg.appendChild(metrics);

                // Add Regenerate button
                const regenBtn = document.createElement('button');
                regenBtn.className = 'regenerate-btn';
                regenBtn.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Regenerate
                `;
                regenBtn.onclick = () => App.regenerate();
                msg.appendChild(regenBtn);

                this.scrollToBottom();
            },

            createMultiAgentContainer(id, domains) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                bubble.innerHTML = '';
                
                const container = document.createElement('div');
                container.className = 'multi-agent-container';
                container.innerHTML = `
                    <div class="multi-agent-header">
                        🧩 Multi-Agent Composition — 
                        ${domains.map(d => `<span class="domain-badge domain-${d.toLowerCase()}">${d.toUpperCase()}</span>`).join(' + ')}
                    </div>
                    <div class="sub-agent-panels">
                        ${domains.map((d, i) => `
                            <div class="sub-agent-panel" id="panel-${id}-${i}">
                                <div class="sub-agent-panel-header">
                                    <span class="domain-badge domain-${d.toLowerCase()}">${d.toUpperCase()}</span>
                                    <span class="sub-agent-status" id="status-${id}-${i}">Waiting...</span>
                                </div>
                                <div class="sub-agent-content message-content" id="content-${id}-${i}"></div>
                            </div>
                        `).join('')}
                    </div>`;
                bubble.appendChild(container);
                this.scrollToBottom();
            },

            updateSubAgentStatus(id, index, status) {
                const statusEl = document.getElementById(`status-${id}-${index}`);
                if (statusEl) statusEl.textContent = status;
            },

            appendSubAgentToken(id, index, token) {
                const contentEl = document.getElementById(`content-${id}-${index}`);
                if (!contentEl) return;
                contentEl.dataset.raw = (contentEl.dataset.raw || '') + token;
                contentEl.innerHTML = this.renderMarkdown(contentEl.dataset.raw);
                
                // Highlight code blocks
                contentEl.querySelectorAll('.code-block code:not(.hljs-highlighted)').forEach((block) => {
                    if (!block.textContent.includes('%%')) {
                        hljs.highlightElement(block);
                        block.classList.add('hljs-highlighted');
                    }
                });
                this.scrollToBottom();
            },

            updateSidebar(status) {
                const list = document.getElementById('specialist-status');
                // Only full re-render if we don't have cards yet or if the number of domains changed
                if (list.children.length === 0 || list.children.length !== Object.keys(status.specialists).length) {
                    list.innerHTML = '';
                    for (const [domain, info] of Object.entries(status.specialists)) {
                        const card = document.createElement('div');
                        card.className = `specialist-card ${info.active ? 'active' : ''} ${App.selectedDomain === domain ? 'manual-select' : ''}`;
                        card.id = `card-${domain}`;
                        card.setAttribute('onclick', `App.toggleDomainSelection('${domain}')`);
                        
                        const isDownloading = API.activeDownloads.has(domain);
                        
                        let actionsHtml = '';
                        if (isDownloading) {
                            actionsHtml = `
                                <div class="download-progress-container" id="progress-container-${domain}" style="display: block;">
                                    <div class="download-progress-bar" id="progress-bar-${domain}" style="width: 0%"></div>
                                    <div class="download-progress-text" id="progress-text-${domain}">Starting...</div>
                                </div>
                            `;
                        } else if (info.cached) {
                            actionsHtml = `
                                <div class="specialist-actions" id="actions-${domain}">
                                    <span class="specialist-size">${info.size_gb > 0 ? info.size_gb + ' GB' : ''}</span>
                                    <button class="action-btn delete" onclick="UI.deleteModel('${domain}', event)" title="Delete Model">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                    </button>
                                </div>
                            `;
                        } else {
                            actionsHtml = `
                                <div class="specialist-actions" id="actions-${domain}">
                                    <span class="specialist-size">Not Downloaded</span>
                                    <button class="action-btn" onclick="UI.downloadModel('${domain}', event)" title="Download Model">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    </button>
                                </div>
                                <div class="download-progress-container" id="progress-container-${domain}">
                                    <div class="download-progress-bar" id="progress-bar-${domain}"></div>
                                    <div class="download-progress-text" id="progress-text-${domain}">0%</div>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="specialist-card-header">
                                <span class="specialist-domain">
                                    <div class="domain-indicator tooltip" style="background: var(--color-${domain});">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" style="margin-left: -1px; margin-top: -1px; opacity: ${info.active ? 1 : 0};"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                    ${domain}
                                </span>
                            </div>
                            <div class="specialist-model" title="${info.gguf_file}">${info.model_id.split('/').pop()}</div>
                            ${actionsHtml}
                        `;
                        list.appendChild(card);
                    }
                } else {
                    // Fast update existing cards
                    for (const [domain, info] of Object.entries(status.specialists)) {
                        const card = document.getElementById(`card-${domain}`);
                        if (card) {
                            if (info.active) card.classList.add('active');
                            else card.classList.remove('active');
                            
                            if (App.selectedDomain === domain) card.classList.add('manual-select');
                            else card.classList.remove('manual-select');
                            
                            const indicatorSvg = card.querySelector('.domain-indicator svg');
                            if(indicatorSvg) indicatorSvg.style.opacity = info.active ? 1 : 0;
                            
                            // Only update actions if not actively downloading to prevent UI flicker
                            if (!API.activeDownloads.has(domain)) {
                                const isCached = info.cached;
                                const actionsEl = document.getElementById(`actions-${domain}`);
                                if (actionsEl) {
                                    if (isCached && actionsEl.querySelector('.delete') == null) {
                                        // Need to switch to delete state
                                        actionsEl.innerHTML = `
                                            <span class="specialist-size">${info.size_gb > 0 ? info.size_gb + ' GB' : ''}</span>
                                            <button class="action-btn delete" onclick="UI.deleteModel('${domain}', event)" title="Delete Model">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                            </button>
                                        `;
                                    } else if (!isCached && actionsEl.querySelector('.delete') != null) {
                                        // Need to switch to download state
                                        actionsEl.innerHTML = `
                                            <span class="specialist-size">Not Downloaded</span>
                                            <button class="action-btn" onclick="UI.downloadModel('${domain}', event)" title="Download Model">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                            </button>
                                        `;
                                    }
                                }
                            }
                        }
                    }
                }

                document.getElementById('stat-queries').textContent = status.session_stats.total_queries;
                const hitRate = (status.session_stats.cache_hits / status.session_stats.total_queries * 100) || 0;
                document.getElementById('stat-cache').textContent = hitRate.toFixed(0) + '%';
                document.getElementById('stat-saved').textContent = Math.max(0, status.session_stats.total_queries - 1);
                document.getElementById('stat-context').textContent = `${status.context_turns}/${status.max_history}`;
            },


            scrollToBottom() {
                this.container.scrollTop = this.container.scrollHeight;
            },

            async deleteModel(domain, event) {
                if (event) {
                    event.stopPropagation();
                    const btn = event.currentTarget;
                    btn.disabled = true;
                    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>';
                }

                try {
                    const response = await fetch(`/models/${domain}`, { method: 'DELETE' });
                    if (response.ok) {
                        API.pollStatus(); // Refresh UI
                    } else {
                        const err = await response.json();
                        alert(`Failed to delete model: ${err.detail}`);
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    alert(`Failed to delete model: ${error.message}`);
                }
            },

            downloadModel(domain, event) {
                if (event) {
                    event.stopPropagation();
                }
                
                // Set UI state
                API.activeDownloads.add(domain);
                const actionsEl = document.getElementById(`actions-${domain}`);
                const progressContainer = document.getElementById(`progress-container-${domain}`);
                const progressBar = document.getElementById(`progress-bar-${domain}`);
                const progressText = document.getElementById(`progress-text-${domain}`);
                
                if (actionsEl) actionsEl.style.display = 'none';
                if (progressContainer) progressContainer.style.display = 'block';
                if (progressBar) progressBar.style.width = '0%';
                if (progressText) progressText.textContent = 'Connecting...';

                // Start SSE Download
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `/models/${domain}/download`, true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                
                let seenBytes = 0;
                
                xhr.onprogress = function() {
                    const freshData = xhr.responseText.substring(seenBytes);
                    const lines = freshData.split('\\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                
                                if (data.status === 'start') {
                                    if (progressText) progressText.textContent = '0%';
                                } else if (data.status === 'progress') {
                                    if (progressBar) progressBar.style.width = `${data.percentage}%`;
                                    if (progressText) progressText.textContent = `${data.percentage}%`;
                                } else if (data.status === 'complete') {
                                    if (progressText) progressText.textContent = 'Verifying...';
                                } else if (data.status === 'error') {
                                    alert(`Download failed: ${data.message}`);
                                    API.activeDownloads.delete(domain);
                                    API.pollStatus(); // Reset UI
                                }
                            } catch (e) {
                                console.warn("Failed to parse SSE line:", line);
                            }
                        }
                    }
                    seenBytes = xhr.responseText.lastIndexOf('\\n\\n'); 
                    if (seenBytes === -1) seenBytes = 0; else seenBytes += 2;
                };

                xhr.onload = function() {
                    API.activeDownloads.delete(domain);
                    // Re-enable actions and hide progress
                    if (actionsEl) actionsEl.style.display = 'flex';
                    if (progressContainer) progressContainer.style.display = 'none';
                    API.pollStatus(); // Refresh full UI to show delete button
                };

                xhr.onerror = function() {
                    console.error("Download network error");
                    API.activeDownloads.delete(domain);
                    API.pollStatus();
                };

                xhr.send(JSON.stringify({ prompt: "" })); // Dummy payload
            },

            renderMarkdown(text) {
                const placeholders = [];
                let pIdx = 0;

                // Step 1: Extract code blocks
                let processed = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                    placeholders.push({ type: 'code', lang: lang || 'plaintext', content: code });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });
                // Handle unclosed block at the end
                processed = processed.replace(/```(\w*)\n?([\s\S]*)$/g, (match, lang, code) => {
                    placeholders.push({ type: 'code', lang: lang || 'plaintext', content: code });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });

                // Step 2: Extract Math blocks
                // Display Math \[ ... \] or $$ ... $$
                processed = processed.replace(/\\\[([\s\S]*?)\\\]/g, (match, math) => {
                    placeholders.push({ type: 'math-display', content: math });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });
                processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, (match, math) => {
                    placeholders.push({ type: 'math-display', content: math });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });
                // Unclosed Display Math
                processed = processed.replace(/\\\[([\s\S]*)$/g, (match, math) => {
                    placeholders.push({ type: 'math-display', content: math });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });

                // Inline Math \( ... \)
                processed = processed.replace(/\\\(([\s\S]*?)\\\)/g, (match, math) => {
                    placeholders.push({ type: 'math-inline', content: math });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });
                // Unclosed Inline Math
                processed = processed.replace(/\\\(([\s\S]*)$/g, (match, math) => {
                    placeholders.push({ type: 'math-inline', content: math });
                    return `%%PLACEHOLDER_${pIdx++}%%`;
                });

                // Step 3: basic markdown — bold, italic, inline code
                processed = processed
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');

                // Step 4: restore placeholders as proper HTML
                processed = processed.replace(/%%PLACEHOLDER_(\d+)%%/g, (match, index) => {
                    const item = placeholders[parseInt(index)];
                    
                    if (item.type === 'code') {
                        const escapedCode = item.content
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');
                        const blockId = `code-${Date.now()}-${index}`;
                        return `
                            <div class="code-block">
                                <div class="code-block-header">
                                    <span class="lang-label">${item.lang}</span>
                                    <button class="copy-btn" onclick="UI.copyCode('${blockId}')">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                        </svg>
                                        Copy
                                    </button>
                                </div>
                                <pre><code id="${blockId}" class="language-${item.lang}">${escapedCode}</code></pre>
                            </div>`;
                    } else if (item.type.startsWith('math')) {
                        if (window.katex) {
                            try {
                                return katex.renderToString(item.content, {
                                    displayMode: item.type === 'math-display',
                                    throwOnError: false
                                });
                            } catch(e) { 
                                return `<span style="color:red">Math Error</span>`; 
                            }
                        }
                        return `[Math: ${item.content}]`;
                    }
                });

                return processed;
            },

            copyCode(blockId) {
                const codeEl = document.getElementById(blockId);
                if (!codeEl) return;
                navigator.clipboard.writeText(codeEl.innerText).then(() => {
                    const btn = codeEl.closest('.code-block').querySelector('.copy-btn');
                    btn.classList.add('copied');
                    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
                    }, 2000);
                });
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        // 3. App Controller
        const App = {
            isStreaming: false,
            abortController: null,
            lastPrompt: '',
            currentImageData: null,
            currentDocFile: null,
            selectedDomain: null,

            async init() {
                this.bindEvents();
                await this.refreshStatus();
                setInterval(() => this.refreshStatus(), 3000);
            },
            
            toggleDomainSelection(domain) {
                if (this.selectedDomain === domain) {
                    this.clearDomainSelection();
                } else {
                    this.selectedDomain = domain;
                    document.getElementById('selected-domain-pill').style.display = 'inline-flex';
                    document.getElementById('selected-domain-text').textContent = `Using: ${domain}`;
                    this.refreshStatus(); // Force UI update
                }
            },
            
            clearDomainSelection() {
                this.selectedDomain = null;
                document.getElementById('selected-domain-pill').style.display = 'none';
                this.refreshStatus(); // Force UI update
            },

            handleDocUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                this.currentDocFile = file;
                const container = document.getElementById('doc-preview-container');
                document.getElementById('doc-preview-name').textContent = '📄 ' + file.name;
                container.style.display = 'flex';
                
                // Automatically enable context memory when a document is uploaded
                // so the model can actually read it from the memory bank.
                const memoryToggle = document.getElementById('memory-toggle');
                if (memoryToggle && !memoryToggle.checked) {
                    memoryToggle.checked = true;
                }
                
                event.target.value = '';
            },

            removeDoc() {
                this.currentDocFile = null;
                document.getElementById('doc-preview-container').style.display = 'none';
            },

            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview-container').style.display = 'block';
                    // Keep full data URI including mime type
                    this.currentImageData = e.target.result;
                };
                reader.readAsDataURL(file);
                event.target.value = ''; // reset
            },

            removeImage() {
                this.currentImageData = null;
                document.getElementById('image-preview-container').style.display = 'none';
                document.getElementById('image-preview').src = '';
            },

            bindEvents() {
                let selectedIndex = -1;
                
                UI.input.addEventListener('keydown', (e) => {
                    const isSlashMenuVisible = UI.slashMenu.classList.contains('show');
                    
                    if (isSlashMenuVisible) {
                        const items = Array.from(UI.slashMenu.querySelectorAll('.slash-menu-item')).filter(item => item.style.display !== 'none');
                        
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            selectedIndex = (selectedIndex + 1) % items.length;
                            items.forEach((item, idx) => item.classList.toggle('selected', idx === selectedIndex));
                            return;
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                            items.forEach((item, idx) => item.classList.toggle('selected', idx === selectedIndex));
                            return;
                        } else if (e.key === 'Enter' && selectedIndex >= 0) {
                            e.preventDefault();
                            items[selectedIndex].click();
                            selectedIndex = -1;
                            return;
                        }
                    }

                    if (e.key === 'Enter' && !e.shiftKey && !isSlashMenuVisible) {
                        e.preventDefault();
                        App.sendMessage();
                    }
                });

                // Auto-resize textarea and slash command detection
                UI.input.addEventListener('input', () => {
                    UI.input.style.height = 'auto';
                    UI.input.style.height = (UI.input.scrollHeight) + 'px';

                    // Slash command logic
                    const text = UI.input.value;
                    const lastWord = text.split(' ').pop();
                    
                    if (lastWord.startsWith('/')) {
                        UI.showSlashMenu();
                        selectedIndex = -1; // Reset selection
                        
                        // Filter menu items
                        const filter = lastWord.substring(1).toLowerCase();
                        const items = UI.slashMenu.querySelectorAll('.slash-menu-item');
                        let hasVisible = false;
                        
                        items.forEach(item => {
                            const title = item.querySelector('.title').textContent.toLowerCase();
                            if (title.includes(filter) || filter === '') {
                                item.style.display = 'flex';
                                hasVisible = true;
                            } else {
                                item.style.display = 'none';
                            }
                        });
                        
                        if (!hasVisible) {
                            UI.hideSlashMenu();
                        }
                    } else {
                        UI.hideSlashMenu();
                    }
                });
                
                // Hide menu on blur
                UI.input.addEventListener('blur', () => {
                    setTimeout(() => UI.hideSlashMenu(), 200); // delay to allow clicks
                });
            },

            async sendMessage(customPrompt) {
                const prompt = customPrompt || UI.input.value.trim();
                if ((!prompt && !this.currentImageData && !this.currentDocFile) || this.isStreaming) return;

                this.isStreaming = true;
                this.lastPrompt = prompt;
                this.abortController = new AbortController();

                const imageData = this.currentImageData;
                const docFile = this.currentDocFile;
                
                this.removeImage();
                this.removeDoc();

                UI.input.value = '';
                UI.input.style.height = 'auto';
                UI.input.disabled = true;
                
                UI.sendBtn.style.display = 'none';
                UI.stopBtn.style.display = 'flex';

                let userMsgText = prompt;
                if (docFile) {
                    userMsgText = `📄 Attached: ${docFile.name}\n\n${prompt}`;
                }
                UI.addUserMessage(userMsgText, imageData);
                const bubbleId = UI.addTypingIndicator();

                if (docFile) {
                    UI.upgradeToBubble(bubbleId, 'Ingesting...');
                    const formData = new FormData();
                    formData.append("file", docFile);
                    try {
                        const response = await fetch('/upload_doc', { method: 'POST', body: formData });
                        if (!response.ok) throw new Error("Upload failed");
                    } catch (e) {
                        console.error(e);
                        document.getElementById(bubbleId).querySelector('.bubble').textContent = "❌ Error: Failed to ingest document. Ensure the server is running.";
                        this.finishGeneration();
                        return;
                    }
                    // clear the bubble to prepare for actual response
                    document.getElementById(bubbleId).querySelector('.bubble').innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
                }
                const enableMemory = document.getElementById('memory-toggle').checked;

                try {
                    await API.streamQuery(userMsgText, imageData, enableMemory, this.selectedDomain, {
                    onRouting: (event) => {
                        UI.upgradeToBubble(bubbleId, event.domain);
                    },
                    onLoaded: (event) => {},
                    onToken: (event) => {
                        UI.appendToken(bubbleId, event.content);
                    },
                    onMultiAgentStart: (event) => {
                        UI.createMultiAgentContainer(bubbleId, event.domains);
                    },
                    onSubAgentStart: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, "Starting...");
                    },
                    onSubAgentLoaded: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, `Loaded in ${event.load_time}s`);
                    },
                    onSubAgentToken: (event) => {
                        UI.appendSubAgentToken(bubbleId, event.index, event.content);
                    },
                    onSubAgentDone: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, `Done (${event.inference_time}s)`);
                    },
                    onDone: (event) => {
                        UI.finalizeMessage(bubbleId, event);
                        this.finishStreaming();
                        this.refreshStatus();
                    },
                    onError: (err) => {
                        console.error("Stream error:", err);
                        const msg = document.getElementById(bubbleId);
                        if (msg) {
                            if (err === 'AbortError' || (err && err.name === 'AbortError')) {
                                const bubble = msg.querySelector('.bubble');
                                if (bubble.innerHTML.includes('class="typing"')) {
                                    bubble.innerHTML = '<span style="color: #888; font-style: italic;">Generation stopped.</span>';
                                }
                            } else {
                                msg.querySelector('.bubble').innerHTML = `<span style="color: #ff5252">Error: ${err}</span>`;
                            }
                        }
                        this.finishStreaming();
                    }
                }, this.abortController.signal);
                } catch (e) {
                    if (e.name === 'AbortError') {
                        const msg = document.getElementById(bubbleId);
                        if (msg) {
                            const bubble = msg.querySelector('.bubble');
                            if (bubble.innerHTML.includes('class="typing"')) {
                                bubble.innerHTML = '<span style="color: #888; font-style: italic;">Generation stopped.</span>';
                            }
                        }
                    } else {
                        console.error("Query failed", e);
                        document.getElementById(bubbleId).querySelector('.bubble').textContent = "❌ Error: " + e.message;
                    }
                    this.finishStreaming();
                }
            },

            stopGeneration() {
                if (this.abortController) {
                    this.abortController.abort();
                    this.finishStreaming();
                }
            },

            finishStreaming() {
                this.isStreaming = false;
                this.abortController = null;
                UI.input.disabled = false;
                UI.sendBtn.style.display = 'flex';
                UI.stopBtn.style.display = 'none';
                UI.input.focus();
            },

            regenerate() {
                if (this.lastPrompt && !this.isStreaming) {
                    this.sendMessage(this.lastPrompt);
                }
            },

            async refreshStatus() {
                try {
                    const status = await API.getStatus();
                    UI.updateSidebar(status);
                } catch (e) { console.error("Status check failed", e); }
            },

            async clearContext() {
                if (confirm("Clear conversation context?")) {
                    await API.clearContext();
                    UI.container.innerHTML = '';
                    await this.refreshStatus();
                }
            }
        };

        App.init();
    </script>

    <div id="lightbox-overlay" onclick="this.style.display='none'">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="">
    </div>
</body>
